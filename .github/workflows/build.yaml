# This workflow will build and unit test the project.
# If the workflow is running on the "main" branch, then
# semantic-release is also run to create a new release (if
# warranted by the new commits being built).

name: build

on:
  push:
    branches: ['main', 'pre-release-2.0']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    # Allow workflow to be triggered manually.

jobs:
  detect-secrets:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: detect-secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Trigger info
        run: |
          echo "Build triggered by event: " ${{ github.event_name }}
          echo "                 git ref: " ${{ github.ref }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python v${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install detect-secrets
        run: |
          pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"

      - name: Run detect-secrets
        run: |
          detect-secrets scan --update .secrets.baseline
          detect-secrets -v audit --report --fail-on-unaudited --fail-on-live --fail-on-audited-real .secrets.baseline

  build:
    name: build-test (node v${{ matrix.node-version }})
    needs: detect-secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v${{ matrix.go-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build/Test Project
        run: |
          npm run test-travis
          npm run lint
          npm run test-docker

      - name: Test npx double-package install
        run: |
          npm pack --workspace packages/validator
          npm pack --workspace packages/ruleset

          # Test without a custom ruleset
          npx --yes --prefer-online \
            -p ./ibm-cloud-openapi-ruleset-*.tgz \
            -p ./ibm-openapi-validator-*.tgz \
            lint-openapi packages/validator/test/cli-validator/mock-files/oas3/clean.yml

          # Test with a custom .spectral.js
          printf "const ibmRuleset = require('@ibm-cloud/openapi-ruleset');\nmodule.exports = { extends: [[ibmRuleset, 'all']], rules: {} };\n" > /tmp/test-spectral.js

          npx --yes --prefer-online \
            -p ./ibm-cloud-openapi-ruleset-*.tgz \
            -p ./ibm-openapi-validator-*.tgz \
            lint-openapi --ruleset /tmp/test-spectral.js \
            packages/validator/test/cli-validator/mock-files/oas3/clean.yml

  publish-release:
    needs: build
    name: semantic-release
    if: "github.ref_name == 'main' && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Publishing Tools
        run: |
          npm install

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx -p @qiwi/semrel-toolkit multi-semrel --deps.release inherit
